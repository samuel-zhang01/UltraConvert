# Recipe checks run inline in the trusted Mac release job. This inert workflow
# deliberately cannot allocate a runner or install into a maintainer account.
name: Homebrew checks run in the release pipeline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks-run-inline:
    if: ${{ false }}
    runs-on: [ultraconvert, local-macos]
    steps:
      - run: echo "Homebrew recipes are audited inline before tap publication."
