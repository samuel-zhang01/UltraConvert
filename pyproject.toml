[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["research", "Archive", "build"]

[tool.ruff.per-file-target-version]
"install.py" = "py39"
"uninstall.py" = "py39"
"scripts/package_app.py" = "py39"
"scripts/build_brand.py" = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
ignore = ["E402"] # Entry points add the local source directory before imports.

[tool.bandit]
# Engines run with argument arrays and shell=False. Inputs never form shell commands.
# B603 cannot distinguish these intentional converter calls from shell interpolation.
skips = ["B404", "B603"]
exclude_dirs = ["tests", "research", "build", "Archive"]
