name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src scripts tests install.py uninstall.py
      - run: ruff format --check src scripts tests install.py uninstall.py
      - run: bandit -r src scripts install.py uninstall.py -c pyproject.toml
      - run: pip-audit -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_installer.py' -v
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install engines and compile native app
        run: python3 install.py --build-from-source
      - name: Format round trips and edge preservation
        run: |
          UC_PY="$HOME/Library/Application Support/UltraConvert/.venv/bin/python"
          "$UC_PY" tests/test_conversion.py
          "$UC_PY" tests/test_edges.py
      - name: Security, batch workflow and rollback checks
        run: |
          UC_PY="$HOME/Library/Application Support/UltraConvert/.venv/bin/python"
          "$UC_PY" -m unittest discover -s tests -p 'test_security.py' -v
          "$UC_PY" -m unittest discover -s tests -p 'test_batch.py' -v
          "$UC_PY" -m unittest discover -s tests -p 'test_installer.py' -v
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: conversion-test-evidence
          path: evidence/local/*.json
          retention-days: 14
