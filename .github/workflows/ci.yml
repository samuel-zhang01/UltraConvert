name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["deploy-vps","ultraconvert"]') }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && github.actor == 'samuel-zhang01')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src scripts tests install.py uninstall.py
      - run: ruff format --check src scripts tests install.py uninstall.py
      - run: bandit -r src scripts install.py uninstall.py -c pyproject.toml
      - run: pip-audit -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_installer.py' -v
      - run: python -m unittest discover -s tests -p 'test_release.py' -v
      - run: python -m unittest discover -s tests -p 'test_runtime.py' -v
      - run: python -m unittest discover -s tests -p 'test_source_collection.py' -v
      - run: python -m unittest discover -s tests -p 'test_update_packaging.py' -v
      - run: python -m unittest discover -s tests -p 'test_homebrew.py' -v
  macos:
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-26' || fromJSON('["local-macos","ultraconvert"]') }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && github.actor == 'samuel-zhang01')
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare disposable native CI interpreter
        run: |
          set -euo pipefail
          ci_python=/opt/homebrew/bin/python3.14
          if [[ ! -x "$ci_python" ]]; then
            ci_python=/usr/local/opt/python@3.14/bin/python3.14
          fi
          # Standard public PR hosts are disposable. The owner's runner uses
          # its existing engines and never runs the user installer.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            for engine in ffmpeg-full imagemagick pandoc gdal mac python@3.14; do
              brew list --versions "$engine" >/dev/null 2>&1 || brew install "$engine"
            done
            if [[ ! -d /Applications/calibre.app ]]; then
              brew install --cask calibre
            fi
            ci_python=/opt/homebrew/bin/python3.14
          fi
          "$ci_python" -m venv --system-site-packages "$RUNNER_TEMP/ultraconvert-venv"
          "$RUNNER_TEMP/ultraconvert-venv/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
      - name: Complete native build, conversion, interface and recovery gates
        run: |
          "$RUNNER_TEMP/ultraconvert-venv/bin/python" scripts/ci_macos.py
      - name: Remove disposable interpreter
        if: always()
        run: rm -rf "$RUNNER_TEMP/ultraconvert-venv"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: conversion-test-evidence
          path: evidence/local/*.json
          retention-days: 3
